name: ProGallery CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ProdGallery
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ProdGallery/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build
        env:
          VITE_API_URL: http://127.0.0.1:8000/api

  backend:
    name: Laravel feature tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prodgallery-api
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: ctype, curl, dom, fileinfo, mbstring, pdo_sqlite, tokenizer, xml
          coverage: none
      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Prepare application key
        run: php artisan key:generate
      - name: Run backend tests
        run: php artisan test
        env:
          APP_ENV: testing
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
          MAIL_MAILER: array
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
